<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>V13 ECOS 자동 갱신</title><style>body{background:#0e1319;color:#edf3fb;font:16px system-ui, sans-serif;margin:0;padding:32px;max-width:880px}article{background:#1c252d;border:1px solid #384450;border-radius:14px;padding:24px;margin:20px 0}h1{font-size:26px}dt{color:#b1c0cb;font-size:14px;margin-top:18px}dd{font-size:27px;font-weight:700;margin:3px 0 0}small{color:#a9b7c3}a{color:#98c9ff}.warn{color:#f8b66e}.ok{color:#64d6a3}</style></head><body><h1>V13 · 신용 스프레드 자동 업데이트</h1><p><a href="./">← 전체 대시보드</a></p><article id="content"><p>최신 공개 지표를 확인 중입니다.</p></article><small>매수·매도 종합 신호는 아직 자동 계산되지 않습니다. 한국은행 금리만 자동 연결한 1단계 화면입니다.</small><script>fetch('./data/ecos_latest.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('아직 데이터가 배포되지 않았습니다');return r.json()}).then(d=>{const e=document.getElementById('content');const lines=[['자료 기준일',d.data_date],['국고채 3년',d.government_3y_pct+'%'],['회사채 AA- 3년',d.corporate_aa_minus_3y_pct+'%'],['신용 스프레드',d.credit_spread_bp+'bp'],['5거래일 변화',d.credit_spread_change_5d_bp+'bp'],['직전 252일 중앙값',d.credit_spread_prior_252d_median_bp+'bp'],['신용위험 추가 경고',d.credit_risk_warning?'주의: 중앙값 상회 및 5일 확대':'동시 조건 불충족']];e.replaceChildren(...lines.map(([k,v])=>{let div=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;div.append(dt,dd);return div}));}).catch(err=>{document.getElementById('content').textContent='데이터를 아직 표시할 수 없습니다: '+err.message})</script></body></html>
