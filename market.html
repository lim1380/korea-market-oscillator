<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>V13 KRX 시장 폭</title><style>body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#0c1118;color:#eaf0f8;margin:0;padding:24px;max-width:800px}a{color:#8ec9ff}.card{background:#1b242d;border:1px solid #31404c;border-radius:14px;padding:24px;margin:16px 0}.metric{font-size:38px;font-weight:750;color:#56d2aa}small{color:#a9b7c5}li{margin:8px 0}.warn{color:#ffcd7d} </style><h1>V13 · KRX 시장 폭 자동 갱신</h1><p><a href="./">← 전체 대시보드</a></p><section class="card"><small>KRX 일별매매정보 기준</small><h2 id="date">불러오는 중</h2><div class="metric" id="ratio">—</div><small>전체 상승 거래대금 / (상승 + 하락 거래대금)</small><p id="status">데이터를 확인하고 있습니다.</p></section><section class="card"><h3>판단 이유</h3><ul><li id="stocks">종목수: —</li><li id="breadth">상승·하락 종목: —</li><li>50% 초과는 V13 매수 확인 필터 중 한 가지입니다. <b>이 숫자 하나가 매수 신호는 아닙니다.</b></li><li>현재 V7 종합점수 및 최종 매매판단은 아직 자동 계산하지 않습니다.</li></ul></section><section class="card"><h3>수집 상태</h3><p id="error">—</p></section><script>fetch('./data/krx_latest.json?x='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('KRX JSON 없음 (아직 수집 전이거나 작업 실패)');return r.json()}).then(d=>{document.getElementById('date').textContent=d.date.slice(0,4)+'-'+d.date.slice(4,6)+'-'+d.date.slice(6,8);document.getElementById('ratio').textContent=d.advancing_value_ratio_pct.toFixed(2)+'%';document.getElementById('status').textContent=d.advancing_value_ratio_pct>50?'상승 거래대금 50% 초과: 필터 통과':'상승 거래대금 50% 이하: 필터 미통과';document.getElementById('stocks').textContent='유효 종목 수: '+d.valid_stocks+' (제외 '+d.excluded_rows+')';document.getElementById('breadth').textContent='상승 '+d.advancing_stocks+'개, 하락 '+d.declining_stocks+'개, 보합 '+d.unchanged_stocks+'개';document.getElementById('error').textContent='공식 KRX 일별 자료, 기준일: '+d.date+'. 실시간 틱 데이터가 아닙니다.'}).catch(e=>{document.getElementById('date').textContent='아직 데이터 없음';document.getElementById('error').textContent=e.message;document.getElementById('error').className='warn'});</script></html>
