name: V13 Stage 7 - Audit formula readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-formula-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify V7 reproduction prerequisites
        run: python3 scripts/audit_v7_formula_readiness.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage7-formula-readiness-report
          path: data/v7_formula_readiness.json
          retention-days: 14
