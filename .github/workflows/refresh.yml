name: Refresh V13 public indicators
on:
  workflow_dispatch:
  schedule:
    # 18:30 KST = 09:30 UTC on weekdays
    - cron: '30 9 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ECOS credit spread
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python3 scripts/update_ecos.py
      - name: Fetch KRX daily market breadth
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python3 scripts/update_krx.py
      - name: Calculate moving-average breadth and 52-week extremes
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python3 scripts/update_breadth.py
      - name: Save KRX indicator history for next run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/krx_history.json data/krx_latest.json
          git add data/krx_stock_rolling.csv.gz data/breadth_latest.json data/breadth_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update KRX market breadth history'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
