name: Refresh V13 public indicators
on:
  workflow_dispatch:
  schedule:
    # 18:37 Korea Standard Time = 09:37 UTC, weekdays
    - cron: '37 9 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ECOS credit-spread data
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python3 scripts/update_ecos.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
