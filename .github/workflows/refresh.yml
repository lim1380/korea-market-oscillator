name: Refresh V13 public indicators and original backtest signals
on:
  workflow_dispatch:
  schedule:
    # 09:30 KST = 00:30 UTC on weekdays
    - cron: '30 0 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ECOS credit spread
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python3 scripts/update_ecos.py
      - name: Fetch KRX daily market breadth
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python3 scripts/update_krx.py
      - name: Calculate moving-average breadth and 52-week extremes
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python3 scripts/update_breadth.py
      - name: Calculate KOSPI SMA125, VKOSPI and KOSPI200 option PCR
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python3 scripts/update_stage5.py
      - name: Calculate KOSPI minus bond ETF 20-session returns
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python3 scripts/update_stage6.py
      - name: Set up Python for verified V7 strategy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V7 calculation dependencies
        run: python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Replay V7 2160 sessions and certify V13 position if possible
        run: python3 scripts/update_v13_original.py
      - name: Save KRX indicators and V7 strategy status for next run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/krx_history.json data/krx_latest.json
          git add data/krx_stock_rolling.csv.gz data/breadth_latest.json data/breadth_history.json
          git add data/kospi_index_history.json data/stage5_latest.json data/stage5_history.json
          git add data/stage6_latest.json data/stage6_history.json
          git add data/v13_backtested_latest.json data/v13_kospi_forward_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update V13 public indicators and original archived-model status'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
